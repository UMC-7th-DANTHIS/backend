name: danthis_dev

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  develop:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Copy Dev Secret
        env:
          DEV_SECRET: ${{ secrets.APPLICATION_DEV_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$DEV_SECRET" | base64 --decode > src/main/resources/application-dev.yml

      - name: Copy OAuth Secret
        env:
          DEV_SECRET: ${{ secrets.APPLICATION_OAUTH_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$DEV_SECRET" | base64 --decode > src/main/resources/application-oauth.yml

      - name: Copy JWT Secret
        env:
          DEV_SECRET: ${{ secrets.APPLICATION_JWT_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$DEV_SECRET" | base64 --decode > src/main/resources/application-jwt.yml

      - name: Copy S3 Secret
        env:
          DEV_SECRET: ${{ secrets.APPLICATION_S3_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$DEV_SECRET" | base64 --decode > src/main/resources/application-s3.yml

      - name: Grant Gradlew Permission
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean compileJava build
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Docker Build & Push to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest" .
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest"

      - name: Get Runner Public IP
        id: runner_ip
        run: |
          echo "::set-output name=ipv4::$(curl -s ifconfig.me)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Add Runner IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.ipv4 }}/32

      - name: Prepare remote directory & check permissions
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            REMOTE_DIR="/home/${{ secrets.EC2_USERNAME }}/danthis"
            echo "====> Creating and fixing permissions on $REMOTE_DIR"
            mkdir -p "$REMOTE_DIR"
            sudo chown -R $USER:$USER "$REMOTE_DIR"
            chmod -R u+rw "$REMOTE_DIR"
            echo "====> Listing contents:"
            ls -al "$(dirname "$REMOTE_DIR")"
            ls -al "$REMOTE_DIR"

      - name: Copy docker-compose.yml to EC2 (with debug)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          source: "./docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/danthis"
          debug: true

      - name: Verify file arrived (remote listing)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            echo "====> After SCP, contents of /home/${{ secrets.EC2_USERNAME }}/danthis:"
            ls -al "/home/${{ secrets.EC2_USERNAME }}/danthis"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/danthis
            sudo docker-compose down
            sudo docker-compose pull
            sudo docker-compose up -d
            sudo docker image prune -f

      - name: Remove Runner IP from Security Group
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.ipv4 }}/32
